# BMAD Brain (BraTS2021 FLAIR 2D slices). Official splits: never re-split.
root: data/raw/Brain
image_size: 240
seed: 0
splits:
  train/good:   {img_dir: ".",  mask_dir: null,  expected_n: 7500}
  valid/good:   {img_dir: img,  mask_dir: label, expected_n: 39}
  valid/Ungood: {img_dir: img,  mask_dir: label, expected_n: 44}
  test/good:    {img_dir: img,  mask_dir: label, expected_n: 640}
  test/Ungood:  {img_dir: img,  mask_dir: label, expected_n: 3075}
mask:
  rule: "foreground = any RGB channel != 0 (alpha ignored); never threshold at 127"
  allowed_rgb: [[0,0,0], [56,55,77], [112,123,143], [255,255,255]]
  interpolation: nearest
patient_overlap:   # measured on Day 1; documented limitation, splits unchanged
  valid_test_ids: ["00124","00134","00154","00191","00630","01180","01388","01471","01597","01646"]

known_issues:
  # 10 byte-identical image+mask pairs are in BOTH valid/Ungood and test/Ungood (all slice 60).
  # Found by scripts/audit_integrity.py and diagnose_cross_split_duplicates.py on 2026-11-03.
  valid_test_duplicate_files:
    - 00124_60.png
    - 00134_60.png
    - 00154_60.png
    - 00191_60.png
    - 00630_60.png
    - 01180_60.png
    - 01388_60.png
    - 01471_60.png
    - 01597_60.png
    - 01646_60.png
  # The same 10 patients also have DIFFERENT slices in each split (valid: 60,70,80,90; test: 60,68,76,84,92).
  # 10 of 11 valid/Ungood patients appear in test. Splits stay official/unmodified. The sensitivity
  # analysis excludes ALL test images of patient_overlap.valid_test_ids.
  sensitivity_exclusion_expected_test_images: 50
